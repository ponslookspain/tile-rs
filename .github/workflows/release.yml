name: Release

# Runs when a version tag is pushed, e.g.  git tag -a v0.3.0 -m "tile-rs 0.3.0" && git push origin v0.3.0
# See docs/RELEASING.md for the full procedure.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Tag must match the version in Cargo.toml
        shell: pwsh
        run: |
          $tagVersion = $env:TAG.TrimStart('v')
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
              Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tagVersion -ne $ver) { throw "Tag $env:TAG does not match Cargo.toml version $ver" }

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Package
        shell: pwsh
        env:
          TILE_RS_SIGN_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          TILE_RS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          TILE_RS_SIGN_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
        run: ./scripts/package.ps1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the Windows installer
        shell: pwsh
        env:
          TILE_RS_SIGN_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          TILE_RS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          TILE_RS_SIGN_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
        run: ./scripts/build-installer.ps1

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $tagVersion = $env:TAG.TrimStart('v')
          ./scripts/release-notes.ps1 -Version $tagVersion -Out notes.md

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $expectedAssets = @(
              "release\tile-rs-v$version-windows-x64.zip",
              "release\tile-rs-v$version-windows-x64.zip.sha256",
              "dist\tile-rs-$version-setup.exe"
          )
          $files = foreach ($asset in $expectedAssets) {
              if (-not (Test-Path $asset)) { throw "Expected release asset is missing: $asset" }
              (Resolve-Path $asset).Path
          }
          $ghArgs = @('release', 'create', $env:TAG) + $files +
              @('--title', "tile-rs $env:TAG", '--notes-file', 'notes.md')
          if ($env:TAG -match '-') { $ghArgs += '--prerelease' }
          gh @ghArgs
