name: Release

# Runs when a version tag is pushed, e.g.  git tag -a v0.3.0 -m "tile-rs 0.3.0" && git push origin v0.3.0
# See docs/RELEASING.md for the full procedure.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: windows-msvc
          save-if: ${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Tag must match the version in Cargo.toml
        shell: pwsh
        run: |
          $tagVersion = $env:TAG.TrimStart('v')
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
              Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tagVersion -ne $ver) { throw "Tag $env:TAG does not match Cargo.toml version $ver" }

      - name: Code signing must be configured
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          ALLOW_UNSIGNED: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
        run: |
          if ($env:CERT_PFX -or $env:CERT_THUMBPRINT) {
              "TILE_RS_REQUIRE_SIGNING=1" | Add-Content -LiteralPath $env:GITHUB_ENV
          } elseif ($env:ALLOW_UNSIGNED -eq 'true') {
              Write-Warning 'Publishing an UNSIGNED release (ALLOW_UNSIGNED_RELEASE=true).'
          } else {
              throw 'No Authenticode certificate is configured. Add the WINDOWS_CERT_* secrets (docs/RELEASING.md), or set the repository variable ALLOW_UNSIGNED_RELEASE=true to publish unsigned on purpose.'
          }

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Package
        shell: pwsh
        env:
          TILE_RS_SIGN_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          TILE_RS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          TILE_RS_SIGN_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
        run: ./scripts/package.ps1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the Windows installer
        shell: pwsh
        env:
          TILE_RS_SIGN_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          TILE_RS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          TILE_RS_SIGN_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
        run: ./scripts/build-installer.ps1 -SkipBuild

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $tagVersion = $env:TAG.TrimStart('v')
          ./scripts/release-notes.ps1 -Version $tagVersion -Out notes.md

      - name: Installer checksum for in-app updates
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $installer = "dist\tile-rs-$version-setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer is missing: $installer" }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  tile-rs-$version-setup.exe" | Set-Content -LiteralPath "$installer.sha256" -Encoding ascii

      - name: Sign installer checksum for in-app updates
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $version = $env:TAG.TrimStart('v')
          ./scripts/sign-update.ps1 -Checksum "dist\tile-rs-$version-setup.exe.sha256"

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $expectedAssets = @(
              "release\tile-rs-v$version-windows-x64.zip",
              "release\tile-rs-v$version-windows-x64.zip.sha256",
              "dist\tile-rs-$version-setup.exe",
              "dist\tile-rs-$version-setup.exe.sha256",
              "dist\tile-rs-$version-setup.exe.sha256.sig"
          )
          $files = foreach ($asset in $expectedAssets) {
              if (-not (Test-Path $asset)) { throw "Expected release asset is missing: $asset" }
              (Resolve-Path $asset).Path
          }
          $ghArgs = @('release', 'create', $env:TAG) + $files +
              @('--title', "tile-rs $env:TAG", '--notes-file', 'notes.md')
          if ($env:TAG -match '-') { $ghArgs += '--prerelease' }
          gh @ghArgs
