name: Release

# Runs when a version tag is pushed, e.g.  git tag -a v0.3.0 -m "tile-rs 0.3.0" && git push origin v0.3.0
# See docs/RELEASING.md for the full procedure.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Tag must match the version in Cargo.toml
        shell: pwsh
        run: |
          $tagVersion = $env:TAG.TrimStart('v')
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
              Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tagVersion -ne $ver) { throw "Tag $env:TAG does not match Cargo.toml version $ver" }

      - name: Test
        run: cargo test --all-targets

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $tagVersion = $env:TAG.TrimStart('v')
          ./scripts/release-notes.ps1 -Version $tagVersion -Out notes.md

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem release\*.zip, release\*.sha256 | ForEach-Object { $_.FullName }
          $ghArgs = @('release', 'create', $env:TAG) + $files +
              @('--title', "tile-rs $env:TAG", '--notes-file', 'notes.md')
          if ($env:TAG -match '-') { $ghArgs += '--prerelease' }
          gh @ghArgs
