[package]
name = "tile-rs"
version = "0.2.0"
edition = "2021"
description = "A small spiral tiling window manager for Windows 10/11 with workspaces, animations and a tray icon"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ponslookspain/tile-rs"
keywords = ["windows", "tiling", "window-manager"]
categories = ["os::windows-apis", "gui"]
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[build-dependencies]
winres = "0.1"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
