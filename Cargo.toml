[package]
name = "tile-rs"
version = "0.6.0"
edition = "2021"
description = "A small spiral tiling window manager for Windows 10/11 with workspaces, animations and a tray icon"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ponslookspain/tile-rs"
keywords = ["windows", "tiling", "window-manager"]
categories = ["os::windows-apis", "gui"]
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Only the settings window uses Slint: software rendering (no OpenGL stack) is plenty for a form,
# and the tray icon is drawn by tile-rs itself.
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2"] }

[build-dependencies]
winres = "0.1"
slint-build = "1.18.1"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
