# cargo-deny: advisories, licenses and sources for CI (`cargo deny check`).

[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2

[licenses]
version = 2
# Every license a dependency may use. Slint is used under its Royalty-Free terms, which need the
# AboutSlint widget on a reachable About screen (see PRODUCT.md).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    # The Slint crates are "GPL-3.0-only OR Royalty-free OR Software": we use the Royalty-free one.
    "LicenseRef-Slint-Royalty-free-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
